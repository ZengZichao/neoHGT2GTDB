name: CI

# Unit and integration tests for the GTDB adaptation, the NCBI regression
# suite, and the documentation/traceability gates. Nothing here contacts the
# network: the GTDB dataset is read-only local data and remote channels are
# disabled by default.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * *'

env:
  NEOHGT_ROOT: ${{ github.workspace }}
  NEOHGT_CODE: ${{ github.workspace }}
  NEOHGT_CACHE: ${{ github.workspace }}/.test-cache
  NEOHGT_TMP: ${{ github.workspace }}/.test-tmp
  PYTHONDONTWRITEBYTECODE: 1

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mark job start
        id: start
        shell: bash
        run: echo "ts=$(date -u +%Y-%m-%dT%H:%M:%S)" >> "$GITHUB_OUTPUT"

      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: neohgt
          python-version: '3.11'
          channels: conda-forge,bioconda,defaults
          auto-activate-base: false

      - name: Install dependencies
        shell: bash -el {0}
        run: |
          conda install -y -c bioconda diamond blast
          conda install -y -c conda-forge numpy scipy pandas scikit-learn matplotlib-base pyyaml
          python -m pip install pytest

      - name: Install neoHGT
        shell: bash -el {0}
        run: python -m pip install --no-deps .

      - name: Unit tests (taxonomy, ranks, workspace guards, no-network)
        shell: bash -el {0}
        run: python -m pytest neoHGT/tests/test_util.py neoHGT/tests/test_util_gtdb.py neoHGT/tests/test_gtdb_core.py -q

      - name: GTDB integration tests on committed fixtures
        shell: bash -el {0}
        # The fixtures are KB-scale excerpts of GTDB r220 genomes recorded in
        # neoHGT/tests/data/GTDB/fixtures.json. No dataset download happens.
        run: python -m pytest neoHGT/tests/test_gtdb_pipeline.py -q

      - name: Fixture provenance (every committed sequence traces to the release)
        shell: bash -el {0}
        # Re-reads the release and checks that every committed fixture record
        # exists in its source with the same residues, that no fixture file
        # lacks a provenance row, and that the published db.faa count holds.
        env:
          GTDB_DIR: ${{ vars.GTDB_DIR }}
        run: |
          if [ -z "${GTDB_DIR:-}" ] || [ ! -d "$GTDB_DIR" ]; then
            echo "GTDB_DIR not provided; the release checks report it as missing"
            python tools/verify_fixture_provenance.py --code . \
              | tee provenance.log
            grep -q 'genomes: 6 (limit 10)' provenance.log || {
              echo "ERROR: fixture manifest does not list six genomes"; exit 1; }
            echo "release-independent checks ran; dataset problems reported:"
            grep -c 'PROBLEM' provenance.log || true
            exit 0
          fi
          python tools/verify_fixture_provenance.py --code . \
            --gtdb-dir "$GTDB_DIR" | tee provenance.log
          grep -q '^verdict: PASS' provenance.log || {
            echo "ERROR: fixture provenance does not trace back to the release";
            exit 1; }

      - name: Documentation links, anchors and language
        shell: bash -el {0}
        # Checks relative links and in-repository anchors in the user docs,
        # rejects CJK text in English documents outside the controlled
        # allow-list, checks that fenced examples define the shell variables
        # they use, and rejects references to internal QC registers or
        # development round numbers.
        run: python tools/verify_docs.py .

      - name: External links (advisory)
        shell: bash -el {0}
        continue-on-error: true
        # Reports the status of every external URL in the user docs. Hosts may
        # rate-limit or reject automated requests, so this step is advisory.
        run: python tools/check_external_links.py --timeout 8

      - name: Register gate - plan ids, options and docs
        shell: bash -el {0}
        # docs/方案编号清单.json freezes the plan-derived IDs because the plan
        # itself is not part of this repository. The gate checks the frozen
        # inventory, the CLI option surface, the documented examples and
        # values, default promises, configuration routes and the machine
        # manifests. The ten internal QC registers are workspace-side and are
        # not in this checkout; the gate reports those checks as skipped.
        run: |
          mkdir -p .gate
          python tools/verify_plan_traceability.py --code . \
            --out .gate/plan_traceability.json | tee gate.log
          grep -q '0 problem(s) -> PASS' gate.log || {
            echo "ERROR: register gate did not pass"; exit 1; }

      - name: Production reachability (can a CLI path arrive at it?)
        shell: bash -el {0}
        # Checks that the functions this adaptation added are reachable from a
        # CLI path. The frozen added-function list is docs/新增函数清单.json;
        # it carries both the added and the upstream halves, so a function
        # added after the freeze is reported as UNTRACKED.
        run: |
          python tools/verify_production_reachability.py --code . \
            --added docs/新增函数清单.json --out .gate/reachability.json \
            | tee reach.log
          grep -q 'problems: 0 undeclared' reach.log || {
            echo "ERROR: reachability gate found undeclared functions"; exit 1; }

      - name: NCBI regression (RT-1)
        shell: bash -el {0}
        # This is a "no new failure" gate, not an "all green" gate: the
        # pre-existing upstream suite has 13 failures in this environment
        # (plot-format assertions and external binaries). The baseline is
        # ci/rt1_baseline_failures.txt; anything failing beyond it is a
        # regression.
        run: |
          python -m pytest neoHGT/tests/test_search.py neoHGT/tests/test_analyze.py \
            neoHGT/tests/test_database.py -q --tb=no \
            | tee ncbi-regression.log || true
          test -s ci/rt1_baseline_failures.txt || {
            echo "ERROR: ci/rt1_baseline_failures.txt missing"; exit 1; }
          grep -qE "[0-9]+ (failed|passed)" ncbi-regression.log || {
            echo "ERROR: pytest produced no summary (did the suite run at all?)"; exit 1; }
          grep '^FAILED' ncbi-regression.log | cut -d' ' -f2 | LC_ALL=C sort > cur.txt
          grep -v '^#' ci/rt1_baseline_failures.txt | LC_ALL=C sort > base.txt
          : > cur_ok.txt
          if [ -s cur.txt ]; then cp cur.txt cur_ok.txt; fi
          new=$(LC_ALL=C comm -13 base.txt cur_ok.txt)
          if [ -n "$new" ]; then
            echo "ERROR: failures that do not exist upstream:"
            echo "$new"
            exit 1
          fi
          echo "RT-1 OK: $(wc -l < cur_ok.txt) failing tests, all pre-existing upstream"

      - name: Guard - the read-only GTDB input must never be written
        shell: bash -el {0}
        env:
          GTDB_DIR: ${{ vars.GTDB_DIR }}
          SINCE: ${{ steps.start.outputs.ts }}
        run: |
          if [ -z "${GTDB_DIR:-}" ] || [ ! -d "$GTDB_DIR" ]; then
            echo "GTDB_DIR not provided; skipping the read-only guard"
            exit 0
          fi
          changed=$(find "$GTDB_DIR" -newermt "$SINCE" -type f 2>/dev/null | head -1)
          if [ -n "$changed" ]; then
            echo "ERROR: GTDB input was modified during this job: $changed"
            exit 1
          fi
          echo "GTDB input untouched since $SINCE"
